# 邻里团 SaaS 单机试点编排（SQLite）。生产多实例请按 docs/生产运行手册.md 切换 PostgreSQL 并拆分 worker。
services:
  app:
    build: .
    container_name: wechat-saas
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      PORT: "3100"
      HOST: "0.0.0.0"
      DATA_DIR: "/app/data"
      DATA_STORE: ${DATA_STORE:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      UPLOAD_DIR: "/app/data/uploads"
      AUDIT_ARCHIVE_DIR: "/app/data/archive/audit"
      BACKUP_DIR: "/app/data/backups"
      # 生产环境必填（否则启动失败）
      AUTH_SECRET: ${AUTH_SECRET:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      PLATFORM_ADMIN_USERNAME: ${PLATFORM_ADMIN_USERNAME:-}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      WX_MOCK: ${WX_MOCK:-false}
      WX_APPID: ${WX_APPID:-}
      WX_SECRET: ${WX_SECRET:-}
      WX_SUBSCRIBE_TEMPLATES: "${WX_SUBSCRIBE_TEMPLATES:-}"
      WX_PAYMENT_ENABLED: ${WX_PAYMENT_ENABLED:-false}
      WX_MCHID: ${WX_MCHID:-}
      WX_PAY_KEY: ${WX_PAY_KEY:-}
      WX_PAY_PRIVATE_KEY: ${WX_PAY_PRIVATE_KEY:-}
      WX_PAY_SERIAL_NO: ${WX_PAY_SERIAL_NO:-}
      WX_NOTIFY_URL: ${WX_NOTIFY_URL:-}
      WX_PAY_PLATFORM_CERTS: ${WX_PAY_PLATFORM_CERTS:-}
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-true}
      AUDIT_ARCHIVE_ENABLED: ${AUDIT_ARCHIVE_ENABLED:-false}
      AUDIT_ARCHIVE_WORKER_ENABLED: ${AUDIT_ARCHIVE_WORKER_ENABLED:-true}
      AUDIT_S3_ENDPOINT: ${AUDIT_S3_ENDPOINT:-}
      AUDIT_S3_REGION: ${AUDIT_S3_REGION:-us-east-1}
      AUDIT_S3_BUCKET: ${AUDIT_S3_BUCKET:-}
      AUDIT_S3_ACCESS_KEY_ID: ${AUDIT_S3_ACCESS_KEY_ID:-}
      AUDIT_S3_SECRET_ACCESS_KEY: ${AUDIT_S3_SECRET_ACCESS_KEY:-}
      AUDIT_S3_OBJECT_LOCK_MODE: ${AUDIT_S3_OBJECT_LOCK_MODE:-COMPLIANCE}
      BACKUP_ENCRYPTION_KEY: ${BACKUP_ENCRYPTION_KEY:-}
      TENANT_SIGNUP_ENABLED: ${TENANT_SIGNUP_ENABLED:-false}
      LOG_FILE: ${LOG_FILE:-}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
    volumes:
      - ./data:/app/data
    # 外部 PostgreSQL 可直接配置 DATABASE_URL；生产主备、TLS、PITR 和 worker 拆分见生产运行手册。
