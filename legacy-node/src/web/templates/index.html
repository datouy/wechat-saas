<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>邻里团</title>
<link rel="stylesheet" href="/static/admin.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="工作台导航">
    <a class="brand" href="#/today" aria-label="邻里团工作台">
      <span class="brand-mark" aria-hidden="true">邻</span>
      <span class="brand-name" id="sidebarStoreName">邻里团</span>
    </a>
    <nav class="primary-nav">
      <a class="nav-link" data-nav="today" href="#/today">今天</a>
      <a class="nav-link" data-nav="products" href="#/products">商品</a>
      <a class="nav-link" data-nav="orders" href="#/orders">订单</a>
      <a class="nav-link" data-nav="customers" href="#/customers">客户</a>
    </nav>
    <details class="more-nav" id="moreNav">
      <summary>更多</summary>
      <div class="more-links">
        <a data-nav="group-buys" href="#/group-buys">团购</a>
        <a data-nav="coupons" href="#/coupons">优惠券</a>
        <a data-nav="surveys" href="#/surveys">问卷</a>
        <a data-nav="appointments" href="#/appointments">预约</a>
        <a data-nav="after-sales" href="#/after-sales">售后</a>
        <a data-nav="growth" href="#/growth" data-roles="owner,manager">会员增长</a>
        <a data-nav="reports" href="#/reports" data-roles="owner,manager">经营报表</a>
        <a data-nav="operations" href="#/operations" data-roles="owner,manager">运营保障</a>
        <a data-nav="audit" href="#/audit" data-roles="owner,manager">审计日志</a>
        <a data-nav="reconciliation" href="#/reconciliation" data-roles="owner,manager">交易对账</a>
        <a data-nav="settings" href="#/settings">设置</a>
      </div>
    </details>
    <div class="sidebar-foot" id="sidebarFoot"></div>
  </aside>
  <button class="sidebar-backdrop" id="sidebarBackdrop" aria-label="关闭导航"></button>

  <main class="main">
    <header class="topbar">
      <button class="icon-button nav-toggle" id="navToggle" aria-label="打开导航" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <h1 id="pageTitle">今天</h1>
      <div class="header-actions" id="headerActions"></div>
    </header>
    <section class="content" id="content" aria-live="polite"></section>
  </main>
</div>

<div class="login-overlay hidden" id="loginOverlay" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
  <form class="login-card" id="loginForm">
    <div class="login-card-head">
      <span class="login-mark" aria-hidden="true">邻</span>
      <div><span>社区团购经营台</span><h2 id="loginTitle">登录邻里团</h2></div>
    </div>
    <p class="login-copy">从客户下单、成团进度到会员复购，在一个工作台里处理今天的经营事项。</p>
    <label class="field-label" for="loginUser">用户名</label>
    <input id="loginUser" name="username" autocomplete="username" value="admin">
    <label class="field-label" for="loginPass">密码</label>
    <input id="loginPass" name="password" type="password" autocomplete="current-password">
    <div class="login-demo-row"><span>本地体验账号 admin / admin123</span><button class="demo-fill" type="button" data-action="fill-demo">填入体验账号</button></div>
    <p class="form-error" id="loginError" aria-live="polite"></p>
    <button class="button primary full" type="submit">登录</button>
  </form>
</div>

<dialog class="dialog" id="appDialog" aria-labelledby="dialogTitle">
  <div class="dialog-header">
    <h2 id="dialogTitle"></h2>
    <button class="icon-button" type="button" data-action="close-dialog" aria-label="关闭">×</button>
  </div>
  <div class="dialog-body" id="dialogBody"></div>
  <div class="dialog-footer" id="dialogFooter"></div>
</dialog>

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<script src="/static/admin-core.js?v=1.1.0"></script>
<script src="/static/admin-catalog.js?v=1.1.0"></script>
<script src="/static/admin-orders.js?v=1.1.0"></script>
<script src="/static/admin-customers.js?v=1.1.0"></script>
<script src="/static/admin-operations.js?v=1.1.0"></script>
<script src="/static/admin-settings.js?v=1.1.0"></script>
<script src="/static/admin.js?v=1.1.0"></script>
</body>
</html>
