global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/wechat-saas.yml

scrape_configs:
  - job_name: wechat-saas
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/secrets/metrics-token
    static_configs:
      - targets:
          - api-a:3100
          - api-b:3100
          - task-worker:3100
