name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  wcs-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build Java modules
        run: mvn -B test

  wcs-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wcs-ui/package-lock.json
      - name: Install admin dependencies
        working-directory: wcs-ui
        run: npm ci
      - name: Typecheck and build admin
        working-directory: wcs-ui
        run: npm run check

  wcs-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: wcs-mobile/package-lock.json
      - name: Install mobile dependencies
        working-directory: wcs-mobile
        run: npm ci
      - name: Build H5
        working-directory: wcs-mobile
        run: npm run build:h5
      - name: Build WeChat mini program
        working-directory: wcs-mobile
        run: npm run build:mp-weixin

