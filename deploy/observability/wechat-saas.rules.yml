groups:
  - name: wechat-saas
    rules:
      - alert: SaaSInstanceDown
        expr: up{job="wechat-saas"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: 邻里团实例不可抓取
          description: "{{ $labels.instance }} 已连续 2 分钟不可用。"
      - alert: SaaSHigh5xxRate
        expr: |
          sum(rate(saas_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(saas_http_requests_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 邻里团 5xx 比例超过 5%
      - alert: SaaSSlowP95
        expr: |
          histogram_quantile(0.95,
            sum by (le, route) (rate(saas_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 邻里团接口 P95 超过 1 秒
          description: "{{ $labels.route }} P95={{ $value }} 秒。"
      - alert: SaaSOutboxDeadLetters
        expr: saas_outbox_dead_letters > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 邻里团存在 Outbox 死信
      - alert: SaaSOutboxBacklog
        expr: saas_outbox_failed > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: 邻里团 Outbox 待重试积压
