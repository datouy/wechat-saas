server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: wcs-admin
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wechat_saas?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

app:
  tenant:
    default-code: t-default
  jwt:
    secret: dev-only-change-this-secret-please-change-now
    expiration-hours: 12
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
  seed:
    enabled: true

  wechat:
    mock: true
    app-id: ""
    app-secret: ""
    mch-id: ""
    api-v3-key: ""
    private-key: ""
    serial-no: ""
    public-key: ""
    public-key-id: ""
    notify-url: ""
    payment-enabled: false
    subscribe-templates: "{}"

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

